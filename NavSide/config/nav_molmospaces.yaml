models:
  inference_backend: tensorrt
  encoder_engine_path: ../asset/models/vae_pretrain_new.plan
  policy_engine_path: ../asset/models/policy_1.plan
  encoder_path: ../asset/models/vae_pretrain_new.onnx
  policy_path: ../asset/models/policy_1.onnx

control:
  dry_run_hz: 8.0
  vx_max: 1
  wz_max: 1.5
  walk_threshold: 0.3
  goal_pos_tolerance: 0.08

depth:
  min_depth: 0.10
  max_depth: 10.0

goal:
  default_goal_w: [3.0, 0.0, 0.0]

logging:
  verbose_sru: false
  summary_hz: 1.0

sim:
  # SRU robot merged with MolmoSpaces iTHOR FloorPlan1.
  mujoco_xml_path: ../asset/merged/phybot_molmospaces_floorplan1.xml
  camera_name: head_camera
  # Strict ZED Mini reproduction: render real capture mode first, then center
  # crop to 1728x1080 and resize to the SRU 64x40 encoder input.
  render_width: 1920
  render_height: 1200
  render_fps: 30.0
  display_scale: 0.5

udp:
  local_ip: 127.0.0.1
  local_port: 8081
  remote_ip: 127.0.0.1
  remote_port: 8080
